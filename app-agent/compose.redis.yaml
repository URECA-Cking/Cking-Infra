# Redis 지표(redis.alloy)를 켤 때 compose.yaml에 덧붙인다. 주소·사용자·비밀번호 파일 경로는 apply.sh가 넘긴다.
# 비밀번호 파일은 서버의 /var/lib/app-agent-secrets에 두고 읽기 전용으로 붙인다.
services:
  alloy:
    environment:
      CKING_REDIS_ADDR: ${CKING_REDIS_ADDR:?Redis 주소가 지정되지 않았습니다}
      CKING_REDIS_USER: ${CKING_REDIS_USER:-}
      CKING_REDIS_PASSWORD_FILE: ${CKING_REDIS_PASSWORD_FILE:-}
    volumes:
      - ./redis.alloy:/etc/cking-alloy/redis.alloy:ro
      - /var/lib/app-agent-secrets:/run/cking:ro
