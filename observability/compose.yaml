name: observability

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=6GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/prometheus:/prometheus
    labels:
      kr.co.cking.config-hash: ${PROMETHEUS_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 512m
    logging: *logging

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - /data/loki:/loki
    labels:
      kr.co.cking.config-hash: ${LOKI_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 384m
    logging: *logging

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    user: "473:473"
    command:
      - run
      - /etc/alloy/host.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./alloy/host.alloy:/etc/alloy/host.alloy:ro
      - /data/alloy:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/udev/data:/run/udev/data:ro
    labels:
      kr.co.cking.config-hash: ${ALLOY_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 256m
    logging: *logging

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "9009:9009"
      - "3500:3500"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      kr.co.cking.config-hash: ${NGINX_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 32m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "10.0.21.245:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: https://dev-monitoring.cking.co.kr
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 지정되지 않았습니다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_GOOGLE_ENABLED: "true"
      GF_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID가 지정되지 않았습니다}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET가 지정되지 않았습니다}
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: "true"
      GF_AUTH_GOOGLE_AUTO_LOGIN: "false"
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_PATH: "$$__file{/run/secrets/grafana_role_attribute_path}"
      GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GOOGLE_SKIP_ORG_ROLE_SYNC: "false"
      GF_AUTH_GOOGLE_USE_REFRESH_TOKEN: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,mysql,mssql,influxdb,opentsdb,grafana-pyroscope-datasource,jaeger,tempo,zipkin
      GOMEMLIMIT: 512MiB
      SLACK_ALERT_WEBHOOK_URL: ${SLACK_ALERT_WEBHOOK_URL:?SLACK_ALERT_WEBHOOK_URL가 지정되지 않았습니다}
      DEADMAN_PING_URL: ${DEADMAN_PING_URL:?DEADMAN_PING_URL가 지정되지 않았습니다}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - /data/grafana:/var/lib/grafana
      - /etc/cking/grafana/role_attribute_path:/run/secrets/grafana_role_attribute_path:ro
    labels:
      kr.co.cking.config-hash: ${GRAFANA_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 640m
    logging: *logging
