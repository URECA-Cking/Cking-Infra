name: observability

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=6GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/prometheus:/prometheus
    labels:
      kr.co.cking.config-hash: ${PROMETHEUS_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 512m
    logging: *logging

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - /data/loki:/loki
    labels:
      kr.co.cking.config-hash: ${LOKI_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 384m
    logging: *logging

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    user: "473:473"
    command:
      - run
      - /etc/alloy/host.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./alloy/host.alloy:/etc/alloy/host.alloy:ro
      - /data/alloy:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/udev/data:/run/udev/data:ro
    labels:
      kr.co.cking.config-hash: ${ALLOY_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 256m
    logging: *logging

  nginx:
    image: nginxinc/nginx-unprivileged:1.31.5-alpine@sha256:19c132c9ab02d3b783f478743dafc7a7f42e27aa7d2bdcbec1bb1128ca8f2a07
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "9009:9009"
      - "3500:3500"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      kr.co.cking.config-hash: ${NGINX_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 32m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 지정되지 않았습니다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GOMEMLIMIT: 460MiB
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - /data/grafana:/var/lib/grafana
    labels:
      kr.co.cking.config-hash: ${GRAFANA_CONFIG_HASH:?설정 해시가 지정되지 않았습니다}
    mem_limit: 512m
    logging: *logging
