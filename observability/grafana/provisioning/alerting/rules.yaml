          severity: "normal"
        annotations:
          summary: "운영 댓글 필터 호출이 10분 동안 5번 이상 실패했습니다. 판정이 늦어지고 있습니다(댓글은 보입니다)."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-comment-filter-failing.md"
      - uid: "cking-prod-comment-filter-queue"
        title: "댓글 판정 대기열 쌓임"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max(executor_queued_tasks{instance=~\"prod-cking-app-.*\",name=\"commentFilterExecutor\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
