          severity: "normal"
        annotations:
          summary: "운영 댓글 판정 대기열이 5분 넘게 50건 이상입니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-comment-filter-queue.md"
  - orgId: 1
