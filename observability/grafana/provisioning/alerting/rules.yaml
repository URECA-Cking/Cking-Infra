          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-recommendation-stalled.md"
  - orgId: 1
    name: "운영 관측"
    folder: "크킹 운영 경보"
    interval: "1m"
    rules:
      - uid: "cking-prod-app-targets"
        title: "앱 서버 지표 부족"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "count(up{job=\"node\",instance=~\"prod-cking-app-.*\"} == 1) or vector(0)"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
