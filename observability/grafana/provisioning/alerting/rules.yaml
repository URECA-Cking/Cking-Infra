# 생성 파일. 경보 기준과 근거는 Infra #80, 운영 규칙(크킹 운영 경보)은 #121. 운영 규칙은 #185에서 켰다
apiVersion: 1
groups:
  - orgId: 1
    name: "앱"
    folder: "크킹 경보"
    interval: "1m"
    rules:
      - uid: "cking-app-down"
        title: "앱 중단"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max(up{job=\"cking-be\",instance=\"dev-cking-app\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
        noDataState: "Alerting"
        execErrState: "Error"
        for: "2m"
        labels:
          severity: "urgent"
        annotations:
          summary: "앱 지표가 2분째 들어오지 않습니다. 앱이 멈췄거나 앱 서버가 응답하지 않습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-app-down.md"
      - uid: "cking-5xx"
        title: "서버 오류 증가"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "(sum(rate(http_server_requests_seconds_count{job=\"cking-be\",instance=\"dev-cking-app\",uri!~\"/readyz|UNKNOWN|REDIRECTION|/\\\\*\\\\*\",status=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count{job=\"cking-be\",instance=\"dev-cking-app\",uri!~\"/readyz|UNKNOWN|REDIRECTION|/\\\\*\\\\*\"}[5m])) and on() sum(rate(http_server_requests_seconds_count{job=\"cking-be\",instance=\"dev-cking-app\",uri!~\"/readyz|UNKNOWN|REDIRECTION|/\\\\*\\\\*\"}[5m])) >= 0.1"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.05
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        labels:
          severity: "urgent"
        annotations:
          summary: "5xx 응답이 전체 요청의 5%를 넘었습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-5xx.md"
      - uid: "cking-stream-stopped"
        title: "Stream 소비 멈춤"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "min by (stream) (redis_stream_group_consumer_idle_seconds{instance=\"dev-cking-app\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 120
        noDataState: "OK"
        execErrState: "Error"
        for: "1m"
        labels:
          severity: "urgent"
        annotations:
          summary: "소비자가 2분 넘게 Stream을 읽으러 오지 않습니다. 응모·적립이 DB에 반영되지 않습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-stream-stopped.md"
      - uid: "cking-stream-lag"
        title: "Stream 밀림"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max by (stream) (redis_stream_group_lag{instance=\"dev-cking-app\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        labels:
          severity: "urgent"
        annotations:
          summary: "Stream에 아직 읽지 않은 메시지가 5분째 남아 있습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-stream-lag.md"
      - uid: "cking-redis-rejected"
        title: "응모 실패 (Redis 쓰기 거부)"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(redis_commands_rejected_calls_total{instance=\"dev-cking-app\"}[5m]))"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "urgent"
        annotations:
          summary: "Redis가 명령을 거부했습니다. 메모리 한도에 닿으면 응모 XADD가 실패합니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-redis-rejected.md"
      - uid: "cking-redis-down"
        title: "Redis 연결 끊김"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "min(redis_up{instance=\"dev-cking-app\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
        noDataState: "OK"
        execErrState: "Error"
        for: "1m"
        labels:
          severity: "urgent"
        annotations:
          summary: "앱 서버 수집기가 1분째 Redis에 붙지 못합니다. Redis가 멈췄으면 응모·적립이 실패합니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-redis-down.md"
      - uid: "cking-stream-pending"
        title: "처리 실패 누적"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max by (stream) (redis_stream_group_messages_pending{instance=\"dev-cking-app\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "10m"
        labels:
          severity: "normal"
        annotations:
          summary: "읽었지만 ACK하지 못한 메시지가 10분째 남아 있습니다. PEL 재처리도 실패하고 있습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-stream-pending.md"
      - uid: "cking-p95"
        title: "응답 지연"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=\"cking-be\",instance=\"dev-cking-app\",uri!~\"/readyz|UNKNOWN|REDIRECTION|/\\\\*\\\\*\"}[5m])))"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 1
        noDataState: "OK"
        execErrState: "Error"
        for: "10m"
        labels:
          severity: "normal"
        annotations:
          summary: "응답 시간 p95가 10분째 1초를 넘었습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-p95.md"
      - uid: "cking-hikari-pending"
        title: "DB 연결 대기"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max(hikaricp_connections_pending{instance=\"dev-cking-app\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        labels:
          severity: "normal"
        annotations:
          summary: "DB 연결을 기다리는 요청이 5분째 있습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-hikari-pending.md"
      - uid: "cking-redis-memory"
        title: "Redis 메모리"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max(redis_memory_used_bytes{instance=\"dev-cking-app\"} / redis_config_maxmemory{instance=\"dev-cking-app\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.7
        noDataState: "OK"
        execErrState: "Error"
        for: "10m"
        labels:
          severity: "normal"
        annotations:
          summary: "Redis 메모리가 한도의 70%를 넘었습니다. 100%에 닿으면 응모 쓰기가 거부됩니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-redis-memory.md"
      - uid: "cking-error-log"
        title: "ERROR 로그"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(logback_events_total{job=\"cking-be\",instance=\"dev-cking-app\",level=\"error\"}[5m]))"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "normal"
        annotations:
          summary: "앱이 ERROR 로그를 남겼습니다. 크킹 로그 대시보드에서 확인하세요."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-error-log.md"
      - uid: "cking-dead-stream"
        title: "Dead Stream 이동"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "loki"
            model:
              refId: "A"
              expr: "sum(count_over_time({container=\"app\",instance=\"dev-cking-app\"} |= \"Dead Stream으로 이동했습니다\" [5m]))"
              queryType: "instant"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "normal"
        annotations:
          summary: "처리에 계속 실패한 메시지가 Dead Stream으로 옮겨졌습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-dead-stream.md"
      - uid: "cking-comment-filter-failing"
        title: "댓글 필터 호출 실패 지속"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "loki"
            model:
              refId: "A"
              expr: "sum(count_over_time({container=\"app\",instance=\"dev-cking-app\"} |= \"필터 서비스 호출에 실패했습니다\" [10m]))"
              queryType: "instant"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 4
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "normal"
        annotations:
          summary: "개발 댓글 필터 호출이 10분 동안 5번 이상 실패했습니다. 판정이 늦어지고 있습니다(댓글은 보입니다)."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-comment-filter-failing.md"
      - uid: "cking-comment-filter-queue"
        title: "댓글 판정 대기열 쌓임"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max(executor_queued_tasks{instance=\"dev-cking-app\",name=\"commentFilterExecutor\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 49
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        labels:
          severity: "normal"
        annotations:
          summary: "개발 댓글 판정 대기열이 5분 넘게 50건 이상입니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-comment-filter-queue.md"
  - orgId: 1
    name: "추천 배치"
    folder: "크킹 경보"
    interval: "1m"
    rules:
      - uid: "cking-recommendation-failing"
        title: "추천 배치 실패 반복"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "loki"
            model:
              refId: "A"
              expr: "sum(count_over_time({instance=\"dev-cking-recommendation\",unit=~\"cking-content-alert@.*\",level=\"error\"}[10m]))"
              queryType: "instant"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 2
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "normal"
        annotations:
          summary: "개발 추천 배치 작업이 10분 동안 3번 이상 실패했습니다. 크리에이터 콘텐츠 태그·추천 반영이 늦어지고 있습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-recommendation-failing.md"
      - uid: "cking-recommendation-stalled"
        title: "추천 배치 멈춤"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "loki"
            model:
              refId: "A"
              expr: "sum(count_over_time({instance=\"dev-cking-recommendation\",unit=\"cking-content-event.service\"}[15m])) or vector(0)"
              queryType: "instant"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
        noDataState: "Alerting"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "normal"
        annotations:
          summary: "개발 추천 배치의 1분 확인 실행 기록이 15분 동안 없습니다. 콘텐츠 태그·추천 반영이 멈췄습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-recommendation-stalled.md"
  - orgId: 1
    name: "관측"
    folder: "크킹 경보"
    interval: "1m"
    rules:
      - uid: "cking-target-down"
        title: "수집 대상 끊김"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "min by (job) (up{instance=\"dev-cking-app\",job=~\"node|redis|alloy\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
