  - orgId: 1
    name: "운영 앱"
    folder: "크킹 운영 경보"
    interval: "1m"
    rules:
      - uid: "cking-prod-5xx"
        title: "서버 오류 증가"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "(sum(rate(http_server_requests_seconds_count{job=\"cking-be\",instance=~\"prod-cking-app-.*\",uri!~\"/readyz|UNKNOWN|REDIRECTION|/\\\\*\\\\*\",status=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count{job=\"cking-be\",instance=~\"prod-cking-app-.*\",uri!~\"/readyz|UNKNOWN|REDIRECTION|/\\\\*\\\\*\"}[5m])) and on() sum(rate(http_server_requests_seconds_count{job=\"cking-be\",instance=~\"prod-cking-app-.*\",uri!~\"/readyz|UNKNOWN|REDIRECTION|/\\\\*\\\\*\"}[5m])) >= 0.1"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.05
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        labels:
          env: "prod"
          severity: "urgent"
        annotations:
          summary: "5xx 응답이 운영 앱 서버 전체 요청의 5%를 넘었습니다."
          runbook_url: "https://github.com/URECA-Cking/Cking-Infra/blob/main/docs/runbooks/cking-5xx.md"
      - uid: "cking-prod-stream-stopped"
