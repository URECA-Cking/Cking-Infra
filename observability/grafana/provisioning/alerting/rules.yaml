        execErrState: "Error"
        for: "5m"
        labels:
          env: "prod"
          team: "infra"
        annotations:
          summary: "{{ $labels.instance }} 수집기가 쓰는 메모리(Go 런타임)가 컨테이너 상한(256MiB)의 95%를 넘었습니다."
