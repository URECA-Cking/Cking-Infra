          - refId: "A"
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "loki"
            model:
              refId: "A"
              expr: "sum(count_over_time({container=\"app\",instance=~\"prod-cking-app-.*\"} |= \"필터 서비스 호출에 실패했습니다\" [10m]))"
              queryType: "instant"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 4
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
