              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
