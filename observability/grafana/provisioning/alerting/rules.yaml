              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "min by (job) ({__name__=~\"up|redis_up\",instance=\"prod-cking-monitor\",job=~\"node|redis|alloy\"})"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "B"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
        noDataState: "Alerting"
        execErrState: "Error"
        for: "5m"
        labels:
          env: "prod"
          team: "infra"
        annotations:
          summary: "감시용 서버의 서버·Redis·수집기 지표가 5분째 들어오지 않거나 ElastiCache에 붙지 못합니다. Stream·Redis 경보가 조용해질 수 있습니다."
