              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "max by (job, instance) (process_resident_memory_bytes{job=\"prometheus\"}) / 536870912 or max by (job, instance) (process_resident_memory_bytes{job=\"loki\"}) / 402653184 or max by (job, instance) (go_memstats_sys_bytes{job=\"alloy\",instance=~\"dev-cking-.*|alloy:12345|grafana:3000|loki:3100|localhost:9090\"} - go_memstats_heap_released_bytes{job=\"alloy\",instance=~\"dev-cking-.*|alloy:12345|grafana:3000|loki:3100|localhost:9090\"}) / 268435456"
              instant: true
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "reduce"
              expression: "A"
              reducer: "last"
              settings:
                mode: "dropNN"
          - refId: "C"
            datasourceUid: "__expr__"
