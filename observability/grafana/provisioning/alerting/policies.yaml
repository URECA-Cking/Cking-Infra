# 데드맨은 5분마다 다시 보내 healthchecks.io가 끊김을 알아채게 한다
apiVersion: 1
policies:
  - orgId: 1
    receiver: "Slack"
    group_by:
      - "grafana_folder"
      - "alertname"
    group_wait: "30s"
    group_interval: "5m"
    repeat_interval: "4h"
    routes:
      - receiver: "데드맨"
        object_matchers:
          - ["route", "=", "deadman"]
        group_wait: "0s"
        group_interval: "1m"
        repeat_interval: "5m"
      - receiver: "Slack 급함"
        object_matchers:
          - ["severity", "=", "urgent"]
      - receiver: "Slack 관측"
        object_matchers:
          - ["team", "=", "infra"]
