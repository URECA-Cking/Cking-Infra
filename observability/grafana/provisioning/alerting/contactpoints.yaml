# 웹후크 주소는 Parameter Store에서 apply.sh가 환경변수로 넘긴다. 운영 경보는 운영 전용 채널의 웹후크를 쓴다
apiVersion: 1
contactPoints:
  - orgId: 1
    name: "Slack"
    receivers:
      - uid: "cking-slack"
        type: "slack"
        settings:
          url: "$SLACK_ALERT_WEBHOOK_URL"
  - orgId: 1
    name: "Slack 급함"
    receivers:
      - uid: "cking-slack-urgent"
        type: "slack"
        settings:
          url: "$SLACK_ALERT_WEBHOOK_URL"
          mentionChannel: "channel"
  - orgId: 1
    name: "Slack 관측"
    receivers:
      - uid: "cking-slack-infra"
        type: "slack"
        settings:
          url: "$SLACK_ALERT_WEBHOOK_URL"
          mentionUsers: "U0C9V1RMCS1"
  - orgId: 1
    name: "Slack 운영"
    receivers:
      - uid: "cking-slack-prod"
        type: "slack"
        settings:
          url: "$SLACK_PROD_ALERT_WEBHOOK_URL"
  - orgId: 1
    name: "Slack 운영 급함"
    receivers:
      - uid: "cking-slack-prod-urgent"
        type: "slack"
        settings:
          url: "$SLACK_PROD_ALERT_WEBHOOK_URL"
          mentionChannel: "channel"
  - orgId: 1
    name: "Slack 운영 관측"
    receivers:
      - uid: "cking-slack-prod-infra"
        type: "slack"
        settings:
          url: "$SLACK_PROD_ALERT_WEBHOOK_URL"
          mentionUsers: "U0C9V1RMCS1"
  - orgId: 1
    name: "데드맨"
    receivers:
      - uid: "cking-deadman"
        type: "webhook"
        disableResolveMessage: true
        settings:
          url: "$DEADMAN_PING_URL"
          httpMethod: "POST"
  # AI 진단(envs/dev/alert_analyzer.tf). 관측 서버 역할로 분석용 SNS에 경보를 JSON으로 보낸다. SNS 제목은 ASCII만 받는다
  - orgId: 1
    name: "AI 진단"
    receivers:
      - uid: "cking-ai-diagnosis"
        type: "sns"
        disableResolveMessage: true
        settings:
          topic_arn: "arn:aws:sns:ap-northeast-2:551372961758:dev-cking-alert-analysis"
          sigv4:
            region: "ap-northeast-2"
          subject: "cking-alert"
          message: '{{ coll.Dict "source" "grafana" "status" .Status "alerts" .Alerts.Firing | data.ToJSON }}'
