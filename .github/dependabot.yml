version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - /observability
      - /app-agent
    schedule:
      interval: weekly
    groups:
      images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # nginx는 홀수 마이너가 mainline이라, stable 버전대 안의 패치와 재빌드만 받는다.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "[TASK] "
    labels:
      - task
    assignees:
      - rmsckd1640

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "[TASK] "
    labels:
      - task
    assignees:
      - rmsckd1640
