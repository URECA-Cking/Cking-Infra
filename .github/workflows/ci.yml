name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # 규칙 플러그인은 .tflint.hcl에 고정한 버전을 GitHub 릴리스에서 받는다(토큰은 받기 횟수 제한용).
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.65.0@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359
        run: |
          args=(--rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/tflint:/plugins" -e TFLINT_PLUGIN_DIR=/plugins -w /repo)
          docker run "${args[@]}" -e GITHUB_TOKEN "$TFLINT_IMAGE" --init --config /repo/.tflint.hcl
          docker run "${args[@]}" "$TFLINT_IMAGE" --recursive --config /repo/.tflint.hcl --format compact
      - run: |
          for dir in envs/account envs/ci envs/dev envs/loadtest envs/loadtest-base envs/prod envs/prod-base envs/security; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose
        run: |
          docker compose -f observability/compose.yaml config --no-interpolate --quiet
          # 수집기는 서버 역할마다 덧붙이는 compose가 다르다: 개발 앱, 운영 앱, 운영 감시용, 부하 테스트, 추천 배치.
          for overlays in "app redis" "app" "redis" "app redis cadvisor" "journal"; do
            args=(-f app-agent/compose.yaml)
            for o in $overlays; do args+=(-f "app-agent/compose.$o.yaml"); done
            docker compose "${args[@]}" config --no-interpolate --quiet
          done
      # 서버와 같은 버전으로 검사하도록 compose에 고정된 이미지를 그대로 쓴다.
      - name: images
        run: |
          image() { docker compose -f observability/compose.yaml config --no-interpolate --images | grep -m1 "^$1"; }
          {
            echo "ALLOY_IMAGE=$(image grafana/alloy)"
            echo "PROMETHEUS_IMAGE=$(image prom/prometheus)"
            echo "LOKI_IMAGE=$(image grafana/loki)"
            echo "NGINX_IMAGE=$(image nginxinc/nginx-unprivileged)"
          } >> "$GITHUB_ENV"
      - name: alloy
        run: |
          docker run --rm -v "$PWD/observability/alloy/host.alloy:/config.alloy:ro" "$ALLOY_IMAGE" validate /config.alloy
          # 수집기는 역할에 맞는 파일을 한 폴더에서 함께 읽는다(apply.sh). compose 검사와 같은 조합을 검사한다.
          for files in "agent app redis" "agent app" "agent redis" "agent app redis cadvisor" "agent journal"; do
            mounts=()
            for f in $files; do mounts+=(-v "$PWD/app-agent/$f.alloy:/cfg/$f.alloy:ro"); done
            docker run --rm "${mounts[@]}" "$ALLOY_IMAGE" validate /cfg
          done
      - name: prometheus
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus/prometheus.yml:/prometheus.yml:ro"
          "$PROMETHEUS_IMAGE" check config /prometheus.yml
      - name: loki
        run: >
          docker run --rm
          -v "$PWD/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro"
          "$LOKI_IMAGE" -config.file=/etc/loki/loki.yaml -verify-config
      - name: dashboards
        run: |
          for f in observability/grafana/provisioning/dashboards/json/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$f" > /dev/null || { echo "::error file=$f::대시보드 형식 오류"; exit 1; }
          done
          dup=$(jq -r .uid observability/grafana/provisioning/dashboards/json/*.json | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::대시보드 uid 중복: $dup"; exit 1; }
      - name: nginx
        run: >
          docker run --rm --read-only --tmpfs /tmp
          -v "$PWD/observability/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          "$NGINX_IMAGE" nginx -t

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck observability/apply.sh app-agent/apply.sh alert-analyzer/build.sh image-normalizer/build.sh \
            loadtest/lt.sh loadtest/agent/lt-app.sh loadtest/gameday/faults.sh loadtest/gameday/faults2.sh \
            .github/scripts/render-templates.sh
          # 부팅 스크립트는 Terraform templatefile이라 변수를 채운 모습으로 펼쳐 검사한다. 파일을 고치면 user_data가 바뀌어 서버가 재시작된다.
          # SC1091: /etc/os-release는 서버에만 있다.
          templates=(envs/dev/templates/observability-init.sh envs/dev/templates/app-init.sh envs/loadtest/templates/app-init.sh modules/k6-server/k6-init.sh
            envs/prod/templates/server-base.sh envs/prod/templates/monitor-init.sh envs/prod/templates/app-init.sh
            envs/prod/templates/nat-init.sh envs/prod/templates/recommendation-init.sh)
          .github/scripts/render-templates.sh "$RUNNER_TEMP/rendered" "${templates[@]}"
          (cd "$RUNNER_TEMP/rendered" && shellcheck -e SC1091 "${templates[@]}")
      - name: python
        run: |
          python3 -m py_compile alert-analyzer/*.py image-normalizer/*.py observability/query.py \
            loadtest/runner/ltrun.py envs/loadtest-base/janitor/janitor.py
      - name: loadtest scenarios
        run: python3 loadtest/runner/ltrun.py check loadtest/scenarios/*.toml
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 경보 진단 Lambda 런타임(python3.13)과 같은 버전
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: checkov
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          bridgecrew/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
          --config-file .checkov.yaml
      # 전체 이력을 검사한다. gitleaks는 git 명령이 실패해도 0으로 끝나므로 검사한 커밋 수도 확인한다.
      - name: gitleaks
        run: |
          out=$(docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --no-banner --no-color /repo 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -Eq '[1-9][0-9]* commits scanned' <<< "$out" || { echo "::error::gitleaks가 커밋을 검사하지 못함"; exit 1; }
