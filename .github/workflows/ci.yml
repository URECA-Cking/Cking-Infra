name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: |
          for dir in envs/dev envs/loadtest envs/loadtest-base envs/prod envs/prod-base; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose
        run: |
          docker compose -f observability/compose.yaml config --no-interpolate --quiet
          # 수집기는 서버 역할마다 덧붙이는 compose가 다르다: 개발 앱, 운영 앱, 운영 감시용, 부하 테스트, 추천 배치.
          for overlays in "app redis" "app" "redis" "app redis cadvisor" "journal"; do
            args=(-f app-agent/compose.yaml)
            for o in $overlays; do args+=(-f "app-agent/compose.$o.yaml"); done
            docker compose "${args[@]}" config --no-interpolate --quiet
          done
      # 서버와 같은 버전으로 검사하도록 compose에 고정된 이미지를 그대로 쓴다.
      - name: images
        run: |
          image() { docker compose -f observability/compose.yaml config --no-interpolate --images | grep -m1 "^$1"; }
          {
            echo "ALLOY_IMAGE=$(image grafana/alloy)"
            echo "PROMETHEUS_IMAGE=$(image prom/prometheus)"
            echo "LOKI_IMAGE=$(image grafana/loki)"
            echo "NGINX_IMAGE=$(image nginxinc/nginx-unprivileged)"
          } >> "$GITHUB_ENV"
      - name: alloy
        run: |
          docker run --rm -v "$PWD/observability/alloy/host.alloy:/config.alloy:ro" "$ALLOY_IMAGE" validate /config.alloy
          # 수집기는 역할에 맞는 파일을 한 폴더에서 함께 읽는다(apply.sh). compose 검사와 같은 조합을 검사한다.
          for files in "agent app redis" "agent app" "agent redis" "agent app redis cadvisor" "agent journal"; do
            mounts=()
            for f in $files; do mounts+=(-v "$PWD/app-agent/$f.alloy:/cfg/$f.alloy:ro"); done
            docker run --rm "${mounts[@]}" "$ALLOY_IMAGE" validate /cfg
          done
      - name: prometheus
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus/prometheus.yml:/prometheus.yml:ro"
          "$PROMETHEUS_IMAGE" check config /prometheus.yml
      - name: loki
        run: >
          docker run --rm
          -v "$PWD/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro"
          "$LOKI_IMAGE" -config.file=/etc/loki/loki.yaml -verify-config
      - name: dashboards
        run: |
          for f in observability/grafana/provisioning/dashboards/json/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$f" > /dev/null || { echo "::error file=$f::대시보드 형식 오류"; exit 1; }
          done
          dup=$(jq -r .uid observability/grafana/provisioning/dashboards/json/*.json | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::대시보드 uid 중복: $dup"; exit 1; }
      - name: nginx
        run: >
          docker run --rm --read-only --tmpfs /tmp
          -v "$PWD/observability/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          "$NGINX_IMAGE" nginx -t

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck observability/apply.sh app-agent/apply.sh
          # Terraform templatefile이라 ${...}는 Terraform 변수다. 파일을 고치면 user_data가 바뀌어 서버가 재시작된다.
          shellcheck -e SC2154,SC1091 envs/dev/templates/observability-init.sh envs/loadtest/templates/app-init.sh envs/loadtest/templates/k6-init.sh \
            envs/prod/templates/server-base.sh envs/prod/templates/monitor-init.sh envs/prod/templates/app-init.sh
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color
