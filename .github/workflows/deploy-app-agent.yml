name: Deploy app agent

on:
  push:
    branches: [main]
    paths:
      - "app-agent/**"
      - ".github/workflows/deploy-app-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app-agent
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::551372961758:role/dev-cking-infra-github-actions-role
  BUCKET: dev-cking-observability-551372961758-ap-northeast-2-an

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 설정 업로드
        run: aws s3 sync --delete app-agent/ "s3://$BUCKET/app-agent/"

      - name: 앱 서버에 적용
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=dev-cking-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$INSTANCE_ID" != "None" ] || { echo "앱 서버를 찾지 못했습니다" >&2; exit 1; }

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy app agent ${GITHUB_SHA::7}" \
            --parameters "commands=[\"aws s3 sync --delete --exact-timestamps --region $AWS_REGION s3://$BUCKET/app-agent/ /opt/app-agent/\",\"bash /opt/app-agent/apply.sh\"]" \
            --query Command.CommandId --output text)

          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending | InProgress | Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "결과: $STATUS"
          [ "$STATUS" = "Success" ]

      # 추천 배치 서버는 부팅할 때 설정을 받는다. 배치 저장소 배포와 같이 서버를 교체해 새 설정으로 띄운다.
      - name: 추천 배치 서버 교체
        env:
          ASG_NAME: dev-cking-recommendation
        run: |
          COUNT=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'length(AutoScalingGroups)' --output text)
          if [ "$COUNT" = 0 ]; then
            echo "추천 배치 서버 그룹이 없어 교체를 건너뛴다"
            exit 0
          fi
          ID=$(aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":0}' --query InstanceRefreshId --output text)
          for _ in $(seq 1 80); do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$ID" --query 'InstanceRefreshes[0].Status' --output text)
            case "$STATUS" in
              Successful)
                echo "추천 배치 서버 교체 완료: $ID"
                exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                echo "::error::추천 배치 서버 교체 $STATUS: $ID"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::추천 배치 서버 교체가 20분 안에 끝나지 않았다: $ID"
          exit 1
