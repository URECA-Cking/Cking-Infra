# 게임 데이 2부(장애 주입 `loadtest/gameday/faults2.sh`). 1부는 RDS 장애 조치 때 k6가 dropped_iterations 합격선(abortOnFail)으로 멈춰 장애 3~5를 못 넣었다.
# 장애 중에도 부하가 계속 가게 합격선 평가를 끈다(--no-thresholds). 판정은 결과 코드·검증으로 한다.
name = "gameday2"
repeat = 1

[seed]
members = 10000

[[steps]]
type = "k6"
name = "warmup"
script = "warmup.js"

[[steps]]
type = "k6"
name = "sustain"
script = "entry-sustain.js"
env = { RATE = "80", DURATION = "32m" }
args = ["--no-thresholds"]
monitor_seconds = 10

[[steps]]
type = "drain"

[[steps]]
type = "verify"
